[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "market-impact-agent"
version = "0.1.0a0"
description = "An auditable event-driven trading agent harness with policy-gated execution."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kenny Zhou" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.25,<5"]

[project.optional-dependencies]
agent = ["mcp>=2,<3"]
data = ["feedparser>=6.0.14,<7", "pyarrow==25.0.1"]
nautilus = ["nautilus-trader==1.231.0"]

[project.scripts]
market-impact = "market_impact_agent.cli:main"

[project.urls]
Homepage = "https://github.com/LemonCANDY42/market-impact-agent"
Repository = "https://github.com/LemonCANDY42/market-impact-agent"
Issues = "https://github.com/LemonCANDY42/market-impact-agent/issues"

[dependency-groups]
dev = [
  "feedparser>=6.0.14,<7",
  "mcp>=2,<3",
  "pyarrow==25.0.1",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_impact_agent"]

