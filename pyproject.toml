[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "market-impact-agent"
version = "0.1.0a0"
description = "An auditable event-driven trading agent harness with policy-gated execution."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kenny Zhou" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.25,<5"]

[project.scripts]
market-impact = "market_impact_agent.cli:main"

[project.urls]
Homepage = "https://github.com/LemonCANDY42/market-impact-agent"
Repository = "https://github.com/LemonCANDY42/market-impact-agent"
Issues = "https://github.com/LemonCANDY42/market-impact-agent/issues"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_impact_agent"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/event-transmission.schema.json" = "market_impact_agent/schemas/event-transmission.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
