[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "market-impact-agent"
version = "0.1.0a0"
description = "An auditable event-driven trading agent harness with policy-gated execution."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kenny Zhou" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["jsonschema>=4.25,<5"]

[project.optional-dependencies]
agent = ["mcp>=2,<3"]
data = ["pyarrow==25.0.1"]
nautilus = ["nautilus-trader==1.231.0"]

[project.scripts]
market-impact = "market_impact_agent.cli:main"

[project.urls]
Homepage = "https://github.com/LemonCANDY42/market-impact-agent"
Repository = "https://github.com/LemonCANDY42/market-impact-agent"
Issues = "https://github.com/LemonCANDY42/market-impact-agent/issues"

[dependency-groups]
dev = [
  "mcp>=2,<3",
  "pyarrow==25.0.1",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_impact_agent"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/event-transmission.schema.json" = "market_impact_agent/schemas/event-transmission.schema.json"
"schemas/signal-intent.schema.json" = "market_impact_agent/schemas/signal-intent.schema.json"
"schemas/backtest-request.schema.json" = "market_impact_agent/schemas/backtest-request.schema.json"
"schemas/backtest-result.schema.json" = "market_impact_agent/schemas/backtest-result.schema.json"
"schemas/phase2-calibration-gate-result.schema.json" = "market_impact_agent/schemas/phase2-calibration-gate-result.schema.json"
"schemas/phase2-calibration-evidence.schema.json" = "market_impact_agent/schemas/phase2-calibration-evidence.schema.json"
"schemas/phase2-calibration-registration-v2.schema.json" = "market_impact_agent/schemas/phase2-calibration-registration-v2.schema.json"
"schemas/phase2-calibration-evidence-v2.schema.json" = "market_impact_agent/schemas/phase2-calibration-evidence-v2.schema.json"
"schemas/phase2-calibration-gate-result-v2.schema.json" = "market_impact_agent/schemas/phase2-calibration-gate-result-v2.schema.json"
"schemas/pattern-pack.schema.json" = "market_impact_agent/schemas/pattern-pack.schema.json"
"schemas/evidence-pack.schema.json" = "market_impact_agent/schemas/evidence-pack.schema.json"
"schemas/judgment-proposal.schema.json" = "market_impact_agent/schemas/judgment-proposal.schema.json"
"schemas/judgment-artifact.schema.json" = "market_impact_agent/schemas/judgment-artifact.schema.json"
"schemas/exposure-registry.schema.json" = "market_impact_agent/schemas/exposure-registry.schema.json"
"schemas/agent-phase2-preregistration.schema.json" = "market_impact_agent/schemas/agent-phase2-preregistration.schema.json"
"schemas/candidate-event-observation.schema.json" = "market_impact_agent/schemas/candidate-event-observation.schema.json"
"schemas/source-coverage-registration.schema.json" = "market_impact_agent/schemas/source-coverage-registration.schema.json"
"schemas/coverage-receipt.schema.json" = "market_impact_agent/schemas/coverage-receipt.schema.json"
"schemas/agent-ensemble-decision.schema.json" = "market_impact_agent/schemas/agent-ensemble-decision.schema.json"
"schemas/research-method-catalog.schema.json" = "market_impact_agent/schemas/research-method-catalog.schema.json"
"schemas/model-provider-profile.schema.json" = "market_impact_agent/schemas/model-provider-profile.schema.json"
"schemas/method-ablation-registration.schema.json" = "market_impact_agent/schemas/method-ablation-registration.schema.json"
"examples/providers/minimax-m3-research-v1.json" = "market_impact_agent/builtin_provider_profiles/minimax-m3-research-v1.json"
"skills/energy-supply/SKILL.md" = "market_impact_agent/builtin_skills/energy-supply/SKILL.md"
"skills/energy-supply/skill.json" = "market_impact_agent/builtin_skills/energy-supply/skill.json"
"skills/evidence-core/SKILL.md" = "market_impact_agent/builtin_skills/evidence-core/SKILL.md"
"skills/evidence-core/skill.json" = "market_impact_agent/builtin_skills/evidence-core/skill.json"
"skills/event-market-context/SKILL.md" = "market_impact_agent/builtin_skills/event-market-context/SKILL.md"
"skills/event-market-context/skill.json" = "market_impact_agent/builtin_skills/event-market-context/skill.json"
"skills/equity-exposure/SKILL.md" = "market_impact_agent/builtin_skills/equity-exposure/SKILL.md"
"skills/equity-exposure/skill.json" = "market_impact_agent/builtin_skills/equity-exposure/skill.json"
"skills/adversarial-risk/SKILL.md" = "market_impact_agent/builtin_skills/adversarial-risk/SKILL.md"
"skills/adversarial-risk/skill.json" = "market_impact_agent/builtin_skills/adversarial-risk/skill.json"
"skills/pattern-review/SKILL.md" = "market_impact_agent/builtin_skills/pattern-review/SKILL.md"
"skills/pattern-review/skill.json" = "market_impact_agent/builtin_skills/pattern-review/skill.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
