name: Bug report
description: Report reproducible incorrect behavior in the harness.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account identifiers, paid data, or private news.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the exact error and redacted evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, versions, and a synthetic or public fixture.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.x or 3.14.x"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, account identifiers, and licensed data.
          required: true
